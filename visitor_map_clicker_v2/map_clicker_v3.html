<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<title>Muuseumi kaardi koordinaatide clicker v3</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        color: #222;
    }

    #topbar {
        position: sticky;
        top: 0;
        z-index: 1000;
        background: white;
        border-bottom: 1px solid #ccc;
        padding: 10px 14px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
    }

    button {
        padding: 7px 12px;
        cursor: pointer;
        font-size: 14px;
    }

    #codeDisplay {
        font-weight: bold;
        font-size: 18px;
        min-width: 180px;
    }

    #status {
        font-size: 13px;
        color: #555;
    }

    #zoomDisplay {
        min-width: 65px;
        text-align: center;
    }

    #main {
        display: flex;
        height: calc(100vh - 70px);
    }

    #sidebar {
        width: 330px;
        min-width: 330px;
        background: white;
        border-right: 1px solid #ccc;
        overflow-y: auto;
        padding: 12px;
    }

    #mapViewport {
        flex: 1;
        overflow: auto;
        background: #ddd;
        position: relative;
    }

    #mapContainer {
        position: relative;
        display: inline-block;
        transform-origin: top left;
    }

    #museumMap {
        display: block;
        user-select: none;
        -webkit-user-drag: none;
        cursor: crosshair;
    }

    .marker {
        position: absolute;
        width: 18px;
        height: 18px;
        margin-left: -9px;
        margin-top: -9px;
        border-radius: 50%;
        background: red;
        border: 2px solid white;
        box-shadow: 0 0 0 1px black;
        pointer-events: none;
        z-index: 20;
    }

    .marker.current {
        width: 24px;
        height: 24px;
        margin-left: -12px;
        margin-top: -12px;
        background: limegreen;
        border: 3px solid white;
        box-shadow: 0 0 0 2px black;
        z-index: 30;
    }

    .marker-label {
        position: absolute;
        transform: translate(10px, -22px);
        background: rgba(255,255,255,0.9);
        border: 1px solid #777;
        padding: 2px 4px;
        font-size: 11px;
        white-space: nowrap;
        pointer-events: none;
        z-index: 25;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
    }

    th, td {
        padding: 5px;
        border-bottom: 1px solid #ddd;
        text-align: left;
    }

    tr.current-row {
        background: #fff4bf;
    }

    tr.done-row {
        background: #e8f6e8;
    }

    #currentCoords {
        margin: 12px 0;
        padding: 10px;
        background: #f5f5f5;
        border: 1px solid #ddd;
        line-height: 1.5;
    }

    .small {
        font-size: 12px;
        color: #666;
    }

    #fileControls {
        margin-bottom: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid #ddd;
    }
</style>
</head>

<body>

<div id="topbar">

    <button onclick="previousCode()">← Eelmine</button>

    <div id="codeDisplay">Laen...</div>

    <button onclick="nextCode()">Järgmine →</button>

    <button onclick="deleteCurrent()">Kustuta punkt</button>

    <span style="border-left:1px solid #ccc; height:28px;"></span>

    <button onclick="zoomOut()">−</button>
    <span id="zoomDisplay">100%</span>
    <button onclick="zoomIn()">+</button>
    <button onclick="resetZoom()">100%</button>

    <span style="border-left:1px solid #ccc; height:28px;"></span>

    <button onclick="exportCSV()">Ekspordi coordinates_v2.csv</button>

    <div id="status"></div>

</div>


<div id="main">

    <div id="sidebar">

        <div id="fileControls">

            <b>T-koodid</b>

            <p class="small">
                Clicker loeb koodid failist
                <code>coordinates.csv</code>,
                aga EI kasuta sealt vanu x/y väärtusi.
            </p>

            <div id="currentCoords">
                Punkti pole veel määratud.
            </div>

        </div>

        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>T-kood</th>
                    <th>x</th>
                    <th>y</th>
                </tr>
            </thead>
            <tbody id="codeTable"></tbody>
        </table>

    </div>


    <div id="mapViewport">

        <div id="mapContainer">

            <img
                id="museumMap"
                src="museum_map.png"
                alt="Muuseumi kaart"
            >

            <div id="markerLayer"></div>

        </div>

    </div>

</div>


<script>

// ============================================================
// MUUTUJAD
// ============================================================

let codes = [];
let coordinates = {};

let currentIndex = 0;

let zoom = 1.0;

let naturalWidth = null;
let naturalHeight = null;


// ============================================================
// KAARDI LAADIMINE
// ============================================================

const image = document.getElementById("museumMap");

image.addEventListener("load", function() {

    naturalWidth = image.naturalWidth;
    naturalHeight = image.naturalHeight;

    /* Console diagnostics removed for public staging. */

    applyZoom();

    updateStatus();
});


// ============================================================
// LOEME KOODID coordinates.csv-st
// ============================================================

async function loadCodes() {

    try {

        const response = await fetch("coordinates.csv");

        if (!response.ok) {
            throw new Error(
                "coordinates.csv ei leitud"
            );
        }

        const text = await response.text();

        const lines = text
            .trim()
            .split(/\r?\n/);

        if (lines.length < 2) {
            throw new Error(
                "coordinates.csv on tühi"
            );
        }

        const header = lines[0]
            .split(",")
            .map(x => x.trim());

        const codeIndex =
            header.indexOf("code");

        if (codeIndex === -1) {
            throw new Error(
                "CSV-s puudub veerg 'code'"
            );
        }

        codes = [];

        for (let i = 1; i < lines.length; i++) {

            const parts = lines[i].split(",");

            if (parts.length <= codeIndex) {
                continue;
            }

            const code = parts[codeIndex].trim();

            if (code) {
                codes.push(code);
            }
        }

        // eemaldame võimalikud duplikaadid
        codes = [...new Set(codes)];

        /* Console diagnostics removed for public staging. */

        currentIndex = 0;

        renderAll();

    }

    catch (error) {

        console.error(error);

        document.getElementById(
            "codeDisplay"
        ).textContent =
            "Viga coordinates.csv laadimisel";

        alert(
            "Ei saanud coordinates.csv faili laadida.\n\n" +
            error.message
        );
    }
}


// ============================================================
// KAARDIL KLIKKIMINE
// ============================================================

image.addEventListener(
    "click",
    function(event) {

        if (!naturalWidth || !naturalHeight) {
            return;
        }

        if (!codes.length) {
            return;
        }

        // Brauseris kuvatud pildi mõõt ja asukoht
        const rect =
            image.getBoundingClientRect();

        // Klikk kuvatud pildi suhtes
        const displayX =
            event.clientX - rect.left;

        const displayY =
            event.clientY - rect.top;

        // Väga oluline:
        //
        // teisendame kuvatud mõõdu tagasi
        // originaalpildi piksliteks.
        //
        // See töötab sõltumata sellest,
        // kas kaart on 25%, 50%, 100%, 200% jne.

        const x =
            displayX
            *
            naturalWidth
            /
            rect.width;

        const y =
            displayY
            *
            naturalHeight
            /
            rect.height;

        const code =
            codes[currentIndex];

        coordinates[code] = {
            x: Math.round(x),
            y: Math.round(y)
        };

        /* Console diagnostics removed for public staging. */

        renderAll();
    }
);


// ============================================================
// ZOOM
// ============================================================

function applyZoom() {

    if (!naturalWidth || !naturalHeight) {
        return;
    }

    image.style.width =
        (naturalWidth * zoom) + "px";

    image.style.height =
        (naturalHeight * zoom) + "px";

    const container =
        document.getElementById(
            "mapContainer"
        );

    container.style.width =
        (naturalWidth * zoom) + "px";

    container.style.height =
        (naturalHeight * zoom) + "px";

    document.getElementById(
        "zoomDisplay"
    ).textContent =
        Math.round(zoom * 100) + "%";

    renderMarkers();
}


function zoomIn() {

    zoom = Math.min(
        zoom * 1.25,
        4
    );

    applyZoom();
}


function zoomOut() {

    zoom = Math.max(
        zoom / 1.25,
        0.1
    );

    applyZoom();
}


function resetZoom() {

    zoom = 1;

    applyZoom();
}


// ============================================================
// MARKERID
// ============================================================

function renderMarkers() {

    const layer =
        document.getElementById(
            "markerLayer"
        );

    layer.innerHTML = "";

    if (!codes.length) {
        return;
    }

    codes.forEach(
        (code, index) => {

            if (!coordinates[code]) {
                return;
            }

            const point =
                coordinates[code];

            const marker =
                document.createElement(
                    "div"
                );

            marker.className =
                "marker";

            if (index === currentIndex) {
                marker.classList.add(
                    "current"
                );
            }

            marker.style.left =
                (point.x * zoom)
                + "px";

            marker.style.top =
                (point.y * zoom)
                + "px";

            layer.appendChild(
                marker
            );


            const label =
                document.createElement(
                    "div"
                );

            label.className =
                "marker-label";

            label.style.left =
                (point.x * zoom)
                + "px";

            label.style.top =
                (point.y * zoom)
                + "px";

            label.textContent =
                code;

            layer.appendChild(
                label
            );
        }
    );
}


// ============================================================
// TABEL
// ============================================================

function renderTable() {

    const tbody =
        document.getElementById(
            "codeTable"
        );

    tbody.innerHTML = "";

    codes.forEach(
        (code, index) => {

            const tr =
                document.createElement(
                    "tr"
                );

            if (index === currentIndex) {

                tr.classList.add(
                    "current-row"
                );

            } else if (
                coordinates[code]
            ) {

                tr.classList.add(
                    "done-row"
                );
            }

            const number =
                document.createElement(
                    "td"
                );

            number.textContent =
                index + 1;

            const codeCell =
                document.createElement(
                    "td"
                );

            codeCell.textContent =
                code;

            const xCell =
                document.createElement(
                    "td"
                );

            const yCell =
                document.createElement(
                    "td"
                );

            if (coordinates[code]) {

                xCell.textContent =
                    coordinates[code].x;

                yCell.textContent =
                    coordinates[code].y;

            } else {

                xCell.textContent = "";
                yCell.textContent = "";
            }

            tr.appendChild(number);
            tr.appendChild(codeCell);
            tr.appendChild(xCell);
            tr.appendChild(yCell);

            tr.addEventListener(
                "click",
                function() {

                    currentIndex =
                        index;

                    renderAll();
                }
            );

            tbody.appendChild(tr);
        }
    );

}


// ============================================================
// PRAEGUNE T-KOOD
// ============================================================

function renderCurrent() {

    if (!codes.length) {
        return;
    }

    const code =
        codes[currentIndex];

    document.getElementById(
        "codeDisplay"
    ).textContent =
        `${currentIndex + 1}/${codes.length} — ${code}`;

    const box =
        document.getElementById(
            "currentCoords"
        );

    if (coordinates[code]) {

        box.innerHTML =
            `<b>${code}</b><br>` +
            `x = ${coordinates[code].x}<br>` +
            `y = ${coordinates[code].y}`;

    } else {

        box.innerHTML =
            `<b>${code}</b><br>` +
            `Punkt pole veel määratud.`;
    }
}


// ============================================================
// EDASI / TAGASI
// ============================================================

function nextCode() {

    if (
        currentIndex
        <
        codes.length - 1
    ) {

        currentIndex++;

        renderAll();
    }
}


function previousCode() {

    if (
        currentIndex > 0
    ) {

        currentIndex--;

        renderAll();
    }
}


// ============================================================
// KUSTUTA
// ============================================================

function deleteCurrent() {

    if (!codes.length) {
        return;
    }

    const code =
        codes[currentIndex];

    delete coordinates[code];

    renderAll();
}


// ============================================================
// STAATUS
// ============================================================

function updateStatus() {

    const completed =
        Object.keys(
            coordinates
        ).length;

    let imageInfo = "";

    if (
        naturalWidth
        &&
        naturalHeight
    ) {

        imageInfo =
            ` | pilt ${naturalWidth} × ${naturalHeight}`;
    }

    document.getElementById(
        "status"
    ).textContent =
        `Märgitud ${completed}/${codes.length}${imageInfo}`;
}


// ============================================================
// KÕIK UUESTI
// ============================================================

function renderAll() {

    renderCurrent();

    renderTable();

    renderMarkers();

    updateStatus();
}


// ============================================================
// CSV EKSPORT
// ============================================================

function exportCSV() {

    if (!codes.length) {
        return;
    }

    let csv =
        "code,x,y\n";

    codes.forEach(
        code => {

            if (
                coordinates[code]
            ) {

                csv +=
                    `${code},` +
                    `${coordinates[code].x},` +
                    `${coordinates[code].y}\n`;

            } else {

                csv +=
                    `${code},,\n`;
            }
        }
    );

    const blob =
        new Blob(
            [csv],
            {
                type:
                "text/csv;charset=utf-8;"
            }
        );

    const url =
        URL.createObjectURL(
            blob
        );

    const link =
        document.createElement(
            "a"
        );

    link.href = url;

    link.download =
        "coordinates_v2.csv";

    document.body.appendChild(
        link
    );

    link.click();

    document.body.removeChild(
        link
    );

    URL.revokeObjectURL(
        url
    );
}


// ============================================================
// KLAVIATUUR
// ============================================================

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "ArrowRight"
        ) {

            nextCode();
        }

        if (
            event.key ===
            "ArrowLeft"
        ) {

            previousCode();
        }

        if (
            event.key ===
            "Delete"
            ||
            event.key ===
            "Backspace"
        ) {

            deleteCurrent();
        }
    }
);


// ============================================================
// START
// ============================================================

loadCodes();

</script>

</body>
</html>
